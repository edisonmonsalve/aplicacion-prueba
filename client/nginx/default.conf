server {
  # La imagen no privilegiada escucha en 8080 y ejecuta Nginx con uid 101.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API se consume en el mismo origen: Nginx hace de proxy inverso y añade
  # la IP real del cliente. `X-Forwarded-For` se sobrescribe para que un cliente
  # no pueda falsificarla; el API confía en un solo proxy (TRUST_PROXY=1).
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    try_files $uri =404;
  }

  # Rutas de la SPA: cualquier URL desconocida devuelve index.html.
  # La CSP solo se aplica al cliente; /api/docs mantiene la suya (Swagger UI).
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'none'" always;
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
